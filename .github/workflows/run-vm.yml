name: Run VM (VM-Fabric)

on:
  workflow_dispatch:
    inputs:
      vm:
        description: 'VM profile ID: debian13 or debian13-arm64'
        type: string
        required: true
        default: debian13
      command:
        description: 'Bash command(s) inside guest; empty = Debian diagnostics'
        type: string
        required: false
        default: ''
  workflow_run:
    workflows: ['Build Debian 13 image (VM-Fabric)', 'Build Debian 13 ARM64 image (VM-Fabric)']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vm-fabric-execution-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  vm:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VM_ID: ${{ inputs.vm || (github.event.workflow_run.name == 'Build Debian 13 ARM64 image (VM-Fabric)' && 'debian13-arm64') || 'debian13' }}
      VM_COMMAND: ${{ inputs.command || '' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested VM profile
        run: |
          set -Eeuo pipefail
          python3 vmfabric.py list
          python3 - <<'PY'
          import os
          from vmfabric import load_profile, ready
          p, _ = load_profile(os.environ['VM_ID'])
          ready(p)
          assert 'github' in p['runtime']
          for key in ('release_tag', 'bundle_asset'):
              assert p.get(key), key
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('VM_TAG=' + p['release_tag'] + '\n')
              f.write('VM_BUNDLE_ASSET=' + p['bundle_asset'] + '\n')
          print('Using profile:', p['id'], 'release:', p['release_tag'])
          PY
          python3 -m py_compile vmfabric.py "profiles/$VM_ID/scripts/guest-exec.py"
      - name: Download and deploy VM-Fabric release
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/vm-download"
          gh release download "$VM_TAG" \
            --dir "$RUNNER_TEMP/vm-download" \
            --pattern "$VM_BUNDLE_ASSET" \
            --pattern "$VM_BUNDLE_ASSET.sha256"
          (cd "$RUNNER_TEMP/vm-download" && sha256sum -c "$VM_BUNDLE_ASSET.sha256")
          python3 vmfabric.py deploy "$VM_ID" \
            --archive "$RUNNER_TEMP/vm-download/$VM_BUNDLE_ASSET" \
            --target "$RUNNER_TEMP/vm-fabric/$VM_ID"
          python3 vmfabric.py verify "$VM_ID" --target "$RUNNER_TEMP/vm-fabric/$VM_ID"
      - name: Execute guest command with root console
        run: |
          set -Eeuo pipefail
          mkdir -p output
          python3 vmfabric.py run "$VM_ID" --mode github \
            --target "$RUNNER_TEMP/vm-fabric/$VM_ID" \
            --command "$VM_COMMAND" \
            --log "$PWD/output/guest-console.log" \
            --output "$PWD/output/guest-output.txt" \
            --timeout 600
      - name: Verify writable overlay
        if: success()
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/vm-fabric/$VM_ID"
          "$d/lib/ld-linux-x86-64.so.2" --library-path "$d/lib" \
            "$d/bin/qemu-img" check -f qcow2 "$d/work.qcow2" > output/overlay-check.txt
      - name: Upload VM command output and serial console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-fabric-run-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
